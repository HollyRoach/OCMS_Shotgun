general:
    # input directory (fastq single or paired end reads)
    input.dir: input.dir
    input_fastqs_dir: input_fastqs.dir
    input_bams_dir: input_bams.dir

extract_refined_bin_reads:
   memory: 4G
   threads: 4
  
extract_fastqs_by_bin:
    memory: 5G
    threads: 8
    time_limit: --time=5:00:00

spades:
  threads: 8
  # total memory in available to the job - not cpu
  total_memory: 10G
  cluster_options: "--mem=10000 --time=02:00:00"

  
